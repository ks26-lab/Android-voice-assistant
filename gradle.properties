# JVM & Memory Optimizations for resource-constrained systems
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m

# Gradle Build Performance & Caching
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=true
kotlin.incremental=true

# AndroidX & Style Configuration
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

